<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Commissioner</title><style>body{background:#101722;color:#dce6f2;font:15px system-ui;margin:0}header,main{max-width:1100px;margin:auto;padding:20px}header{border-bottom:1px solid #344257}h1,h2,h3{color:#fff}h1{letter-spacing:2px}button,select,input{background:#24364d;color:white;border:1px solid #435875;border-radius:6px;padding:10px;margin:4px;cursor:pointer}button:hover{background:#365475}button:disabled{opacity:.4}section{background:#192536;border:1px solid #304158;border-radius:10px;padding:16px;margin:12px 0}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:8px;border-bottom:1px solid #344257}small,p{color:#adbed1}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:12px}.scroll{overflow:auto}strong{color:#e8b96d}nav{display:flex;flex-wrap:wrap}#advance{background:#326d94;font-weight:bold}</style><style>.logo{width:36px;height:36px;object-fit:contain;flex-shrink:0}.identity{display:inline-flex;align-items:center;gap:7px;border-left:3px solid var(--team);padding-left:6px}.match{display:flex;align-items:center;justify-content:space-between;gap:8px}.win{color:#83d6a6}.muted{opacity:.7}article{background:#111d2c;border-left:4px solid var(--team,#4b6280);padding:12px;margin:10px 0;border-radius:8px}article h3{margin:10px 0 4px}article p{margin:5px 0}.tabs{display:flex;position:sticky;top:0;background:#101722;z-index:1}.active{background:#326d94}.reveal{padding:12px;background:#24364d;border-radius:8px}button{min-height:44px}td,th{font-size:14px}@media(max-width:500px){header,main{padding:10px}h1{font-size:24px}td,th{padding:5px;font-size:12px}.logo{width:27px;height:27px}}</style><style>.bracket{display:grid;grid-template-columns:repeat(3,minmax(215px,1fr));gap:12px;overflow-x:auto}.bracket article{margin:12px 0}.bracket .match{flex-wrap:wrap}.bracket h4{color:#e8b96d}</style></head><body><header><small>FOOTBALL UN const groups=['AFC East','AFC North','AFC South','AFC West','NFC East','NFC North','NFC South','NFC West'];const names=['Buffalo Bills|Miami Dolphins|New England Patriots|New York Jets','Baltimore Ravens|Cincinnati Bengals|Cleveland Browns|Pittsburgh Steelers','Houston Texans|Indianapolis Colts|Jacksonville Jaguars|Tennessee Titans','Denver Broncos|Kansas City Chiefs|Las Vegas Raiders|Los Angeles Chargers','Dallas Cowboys|New York Giants|Philadelphia Eagles|Washington Commanders','Chicago Bears|Detroit Lions|Green Bay Packers|Minnesota Vikings','Atlanta Falcons|Carolina Panthers|New Orleans Saints|Tampa Bay Buccaneers','Arizona Cardinals|Los Angeles Rams|San Francisco 49ers|Seattle Seahawks'];const key='commissioner-v1';let s;try{s=JSON.parse(localStorage.getItem(key))}catch(e){};let page='Headquarters',inspect=false;const tiers=['Terrible','Poor','Average','Good','Elite'];function rnd(){s.seed=(Math.imul(s.seed,1664525)+1013904223)>>>0;return s.seed/4294967296}function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function save(){try{localStorage.setItem(key,JSON.stringify(s))}catch(e){document.getElementById('status').textContent+=' • Save unavailable; keep this tab open'}}function team(i){return s.teams.find(t=>t.id===i)}function clamp(x){return Math.max(0,Math.min(4,x))}function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function nm(i){return esc(team(i).name)}function pct(t){return t.w+t.l?t.w/(t.w+t.l):0}function reset(t){Object.assign(t,{w:0,l:0,dw:0,dl:0,cw:0,cl:0,st:0,sum:0,n:0,pw:0,seed:0,div:false,conf:false,champ:false})}function schedule(){let a=shuffle(s.teams.map(t=>t.id)),weeks=[];if(a.length%2)a.push(-1);for(let r=0;r<Math.min(s.games,a.length-1);r++){let games=[];for(let j=0;j<a.length/2;j++){let x=a[j],y=a[a.length-1-j];if(x!==-1&&y!==-1)games.push([x,y])}weeks.push(games);a.splice(1,0,a.pop())}return weeks}function start(){s.week=0;s.phase='regular';s.results=[];s.news=['A new season begins. Every franchise has a fresh opportunity.'];s.teams.forEach(reset);s.schedule=schedule();s.bracket=[];s.pred=rankHistorical().slice(0,5).map(t=>t.id);s.last=[]}function rankHistorical(){return [...s.teams].sort((a,b)=>(b.history.at(-1)?.wins||0)-(a.history.at(-1)?.wins||0))}if(!s){s={season:1,seed:crypto.getRandomValues(new Uint32Array(1))[0],games:17,slots:6,impact:5,teams:names.flatMap((g,d)=>g.split('|').map((name,j)=>({id:d*4+j,name,d,tier:2,history:[]}))),archive:[],rivals:{},log:[]};start();save()}
function record(a,b,post=false){let x=team(a),y=team(b),p=.5+(x.tier-y.tier)*s.impact/100+((x.momentum||0)-(y.momentum||0))*.01; p=Math.max(.2,Math.min(.8,p));let w=rnd()<p?x:y,l=w===x?y:x;if(post){w.pw++;let k=[a,b].sort((a,b)=>a-b).join(':');s.rivals[k]=(s.rivals[k]||0)+2}else{w.w++;l.l++;w.st=Math.max(0,w.st)+1;l.st=Math.min(0,l.st)-1;if(w.d===l.d){w.dw++;l.dl++}if(Math.floor(w.d/4)===Math.floor(l.d/4)){w.cw++;l.cl++}}let g={a,b,w:w.id,l:l.id,post,stage:post?s.phase:"regular",week:s.week,wr:w.w+"–"+w.l,lr:l.w+"–"+l.l};s.results.push(g);return g}function ratio(a,b){return a+b?a/(a+b):0}function sortTeams(ts){let tie=new Map(shuffle(ts.map(t=>t.id)).map((id,i)=>[id,i]));return [...ts].sort((a,b)=>{let v=pct(b)-pct(a);if(v)return v;let h=s.results.filter(g=>!g.post&&[g.a,g.b].includes(a.id)&&[g.a,g.b].includes(b.id));v=h.filter(g=>g.w===b.id).length-h.filter(g=>g.w===a.id).length;return v||ratio(b.dw,b.dl)-ratio(a.dw,a.dl)||ratio(b.cw,b.cl)-ratio(a.cw,a.cl)||tie.get(a.id)-tie.get(b.id)})}function displayRank(ts){return [...ts].sort((a,b)=>pct(b)-pct(a)||ratio(b.dw,b.dl)-ratio(a.dw,a.dl)||a.id-b.id)}function playoffs(){s.phase='wild';s.pools=[0,1].map(c=>{let leaders=[];for(let d=c*4;d<c*4+4;d++){let t=sortTeams(s.teams.filter(t=>t.d===d))[0];if(t){t.div=true;leaders.push(t)}}let other=sortTeams(s.teams.filter(t=>Math.floor(t.d/4)===c&&!t.div));let pool=sortTeams(leaders).concat(other).slice(0,s.slots);pool.forEach((t,i)=>t.seed=i+1);return pool.map(t=>t.id)});s.news.unshift('The playoff field is set. Division champions occupy the top seeds.');}function round(){let stage=s.phase;s.last=[];if(stage==='super'){let g=record(s.pools[0][0],s.pools[1][0],true);s.last=[g];team(g.w).champ=true;s.news.unshift(nm(g.w)+' wins Super Bowl '+s.season+'!');finish();return}let next=[];for(let pool of s.pools){pool=[...pool].sort((a,b)=>team(a).seed-team(b).seed);let winners=[];if(stage==='wild'&&s.slots===6)winners.push(...pool.splice(0,2));if(stage==='wild'&&s.slots===7)winners.push(pool.shift());while(pool.length>1){let g=record(pool.shift(),pool.pop(),true);s.last.push(g);winners.push(g.w)}if(pool.length)winners.push(pool[0]);next.push(winners)}s.pools=next;s.news.unshift(stage+' round: '+s.last.map(g=>nm(g.w)+' advances').join('; '));if(next[0].length===1){next.forEach(p=>team(p[0]).conf=true);s.phase='super'}else s.phase=next[0].length===2?'conference':'division'}
function finish(){let ranked=sortTeams(s.teams);s.order=ranked.map(t=>t.id);for(let t of s.teams){let opp=s.results.filter(g=>!g.post&&(g.a===t.id||g.b===t.id)).map(g=>pct(team(g.a===t.id?g.b:g.a)));let sos=opp.reduce((a,b)=>a+b,0)/(opp.length||1);let prestige=t.w+100*t.champ+40*t.conf+15*t.div+10*(t.seed>0)+15*t.pw+25*(t.l===0);let score=30*pct(t)+35*(t.champ?1:t.conf?.8:t.pw>=2?.6:t.pw===1?.4:t.seed?.2:0)+25*(t.sum/(t.n||1))/4+10*sos;t.history.push({season:s.season,name:t.name,wins:t.w,losses:t.l,champ:t.champ,conf:t.conf,div:t.div,play:!!t.seed,pw:t.pw,prestige,score,tier:t.sum/(t.n||1),sos});}s.archive.push({season:s.season,champ:s.teams.find(t=>t.champ).id,rows:ranked.map(t=>({name:t.name,w:t.w,l:t.l,d:t.d}))});for(let d=0;d<8;d++){let a=ranked.filter(t=>t.d===d);if(a.length>1&&Math.abs(a[0].w-a[1].w)<=1){let k=[a[0].id,a[1].id].sort((a,b)=>a-b).join(':');s.rivals[k]=(s.rivals[k]||0)+1}}s.phase='review'}function advance(){if(s.phase==='regular'){s.week++;s.last=s.schedule[s.week-1].map(g=>record(...g));for(let t of s.teams){t.sum+=t.tier;t.n++;let r=rnd(),delta=r<.0025?2:r<.025?1:r<.0275?-2:r<.05?-1:0;let old=t.tier;t.tier=clamp(t.tier+delta);if(old!==t.tier&&rnd()<.35)s.news.unshift(nm(t.id)+(delta>0?' reportedly gaining confidence behind the scenes.':' faces questions about organizational direction.'))}let hot=displayRank(s.teams)[0];s.news.unshift('Week '+s.week+': '+nm(hot.id)+' leads the league at '+hot.w+'–'+hot.l+'.');if(s.week===s.schedule.length)playoffs()}else if(['wild','division','conference','super'].includes(s.phase))round();else if(s.phase==='review'){s.phase='owners';s.proposals=shuffle([{label:'Change playoff field to 8 per conference',k:'slots',v:8},{label:'Restore 6-team conference playoffs',k:'slots',v:6},{label:'Increase tier impact to 7 points',k:'impact',v:7},{label:'Reduce tier impact to 3 points',k:'impact',v:3},{label:'Shorten schedule to 16 games',k:'games',v:16},{label:'Restore 17-game schedule',k:'games',v:17}]).slice(0,3).map(p=>({...p,yes:s.teams.filter(()=>rnd()<.5).length,done:false}));}else if(s.phase==='owners'){s.phase='development';s.dev=[];for(let t of s.teams){let pos=s.order.indexOf(t.id)/s.order.length,p=pos>=.75?.45:pos>=.5?.30:pos>=.25?.20:.10;let old=t.tier;if(rnd()<p)t.tier=clamp(t.tier+(rnd()<.12?2:1));else if(rnd()<.20)t.tier=clamp(t.tier-1);if(rnd()<.025){t.tier=clamp(t.tier+(rnd()<.5?1:-1));s.dev.push(nm(t.id)+' announces new ownership.')}if(old!==t.tier&&rnd()<.4)s.dev.push(nm(t.id)+' is drawing renewed attention from insiders.')}if(!s.dev.length)s.dev.push('A quiet offseason: no major public reports.')}else if(s.phase==='development'){s.phase='preseason';s.pred=rankHistorical().map(t=>({id:t.id,value:pct(t)*12+t.tier*.5+rnd()*3})).sort((a,b)=>b.value-a.value).slice(0,5).map(x=>x.id)}else if(s.phase==='preseason'){s.season++;start()}save();render()}
const phases={regular:'Next week',wild:'Wild card round',division:'Divisional round',conference:'Conference championships',super:'Super Bowl',review:'Ownership meetings',owners:'Run rebuilding lottery',development:'Preseason report',preseason:'Start next season'};const pages=['Headquarters','Standings','Schedule','Media','Franchises','Postseason','History','Commissioner'];function go(p){page=p;render()}function table(headers,rows){return '<div class="scroll"><table><tr>'+headers.map(x=>'<th>'+x+'</th>').join('')+'</tr>'+rows.map(r=>'<tr>'+r.map(x=>'<td>'+x+'</td>').join('')+'</tr>').join('')+'</table></div>'}function sec(h,b){return '<section><h2>'+h+'</h2>'+b+'</section>'}function results(gs){return table(['Winner','Loser'],gs.map(g=>[nm(g.w),nm(g.l)]))}function standings(ts){return table(['Team','W','L','Div','Streak'],displayRank(ts).map(t=>[esc(t.name),t.w,t.l,t.dw+'–'+t.dl,t.st>0?'W'+t.st:t.st<0?'L'+(-t.st):'—']))}function totals(t){return t.history.reduce((a,h)=>a+h.prestige,0)}function historical(){let all=s.teams.flatMap(t=>t.history.map(h=>({...h,id:t.id})));let dyn=[];for(let t of s.teams)for(let n of [5,10])for(let i=0;i+n<=t.history.length;i++){let a=t.history.slice(i,i+n);dyn.push([t.name,n,a[0].season,a.at(-1).season,a.reduce((x,h)=>x+h.prestige,0),a.filter(h=>h.champ).length])}return sec('Franchise prestige',table(['Franchise','Points','Titles','Points / season'],[...s.teams].sort((a,b)=>totals(b)-totals(a)).map(t=>[esc(t.name),totals(t),t.history.filter(h=>h.champ).length,(totals(t)/(t.history.length||1)).toFixed(1)])))+sec('Greatest single-season teams',table(['Team','Season','Record','Champion','Greatness','Avg tier'],all.sort((a,b)=>b.score-a.score).slice(0,50).map(h=>[esc(h.name),h.season,h.wins+'–'+h.losses,h.champ?'Yes':'No',h.score.toFixed(1),h.tier.toFixed(2)])))+sec('Dynasty rankings',table(['Franchise','Window','Seasons','Prestige','Titles'],dyn.sort((a,b)=>b[4]/b[1]-a[4]/a[1]).slice(0,40).map(x=>[esc(x[0]),x[1]+' years',x[2]+'–'+x[3],x[4],x[5]])))+sec('Season archives',s.archive.slice().reverse().map(a=>'<details><summary>Season '+a.season+' • '+nm(a.champ)+'</summary>'+table(['Team','W','L'],a.rows.map(r=>[esc(r.name),r.w,r.l]))+'</details>').join(''))+sec('25-season parity challenge',`<p>${s.archive.length}/25 seasons completed. Unique champions: ${new Set(s.archive.map(a=>a.champ)).size}. Suggested goal: at least 12 distinct champions in the first 25 seasons.</p>`)}
function vote(i,override){let p=s.proposals[i];if(p.done)return;p.done=true;if(override||p.yes>=Math.ceil(s.teams.length*.75)){s[p.k]=p.v;p.out='Adopted'+(override?' by override':'');}else p.out='Rejected';s.log.push('Season '+s.season+': '+p.label+' — '+p.out);save();render()}function intervene(){let t=team(+document.getElementById('target').value),v=document.getElementById('action').value;t.tier=clamp(v==='up'?t.tier+1:v==='down'?t.tier-1:+v);s.log.push('Season '+s.season+': intervention for '+t.name);save();render()}function renameTeam(){if(s.phase!=='owners')return;let t=team(+document.getElementById('target').value),n=prompt('New franchise name',t.name);if(n&&n.trim())t.name=n.trim();save();render()}function realign(){if(s.phase!=='owners')return;let t=team(+document.getElementById('target').value),d=+prompt('Division number 0–7: '+groups.map((g,i)=>i+' '+g).join(', '),t.d);if(Number.isInteger(d)&&d>=0&&d<8&&s.teams.filter(x=>x.d===t.d).length>1)t.d=d;save();render()}function expand(){if(s.phase!=='owners')return;let n=prompt('New franchise name');if(!n)return;let d=+prompt('Division number 0–7: '+groups.join(', '),'0');if(!Number.isInteger(d)||d<0||d>7)return; s.teams.push({id:Math.max(...s.teams.map(t=>t.id))+1,name:n,d,tier:2,history:[]});save();render()}
function render(){document.getElementById('status').textContent='Season '+s.season+' • '+(s.phase==='regular'?'Week '+s.week+' / '+s.schedule.length:s.phase.toUpperCase())+' • Autosave';document.getElementById('advance').textContent=phases[s.phase];document.getElementById('nav').innerHTML=pages.map(p=>`<button onclick="go('${p}')">${p}</button>`).join('');let h='',rank=displayRank(s.teams),top=rank[0];if(page==='Headquarters'){h=sec('League headlines',s.news.slice(0,5).map(n=>'<p>'+n+'</p>').join(''))+sec('Latest results',s.last.length?results(s.last):'<p>Awaiting kickoff.</p>')+sec('League leaders',standings(rank.slice(0,8)));if(s.phase==='owners'||s.phase==='development'||s.phase==='preseason')h+=sec('Offseason report',s.phase==='owners'?'Visit Commissioner to review proposals.':s.phase==='development'?s.dev.join('<br>'):'Preseason contenders: '+s.pred.map(nm).join(', '))}if(page==='Standings')h='<div class="grid">'+groups.map((g,i)=>sec(g,standings(s.teams.filter(t=>t.d===i)))).join('')+'</div>';if(page==='Schedule')h=s.schedule.map((gs,i)=>sec('Week '+(i+1),table(['Team','Opponent','Result'],gs.map(([a,b])=>{let g=s.results.find(g=>!g.post&&g.a===a&&g.b===b);return[nm(a),nm(b),g?nm(g.w)+' wins':'Scheduled']})))).join('');if(page==='Media'){let hot=[...s.teams].sort((a,b)=>b.st-a.st)[0];h=sec('The football desk',`<p><strong>Marcus Reed | Statistical view</strong><br>${nm(top.id)} owns a ${top.w}–${top.l} record. Schedule quality will help distinguish real contenders.</p><p><strong>Vince Callahan | Hot take</strong><br>${hot.st>0?nm(hot.id)+' is the hottest story with '+hot.st+' consecutive wins.':'No winning streak has emerged yet.'}</p><p><strong>Claire Bennett | Historical view</strong><br>${s.archive.length?nm([...s.teams].sort((a,b)=>totals(b)-totals(a))[0].id)+' leads the all-time prestige race.':'Every franchise is writing its first chapter.'}</p>`)+sec('Power rankings',standings(rank))+sec('Preseason picks',s.pred.map(nm).join(', '))+sec('Emerging rivalries',table(['Matchup','Intensity'],Object.entries(s.rivals).sort((a,b)=>b[1]-a[1]).map(([k,v])=>[k.split(':').map(Number).map(nm).join(' vs '),v])))+sec('News wire',s.news.slice(0,20).map(n=>'<p>'+n+'</p>').join(''))}if(page==='Franchises')h=s.teams.map(t=>sec(esc(t.name),`<p>${groups[t.d]} • Prestige ${totals(t)} • Championships ${t.history.filter(h=>h.champ).length}</p>`+table(['Season','W–L','Prestige','Greatness'],t.history.map(h=>[h.season,h.wins+'–'+h.losses,h.prestige,h.score.toFixed(1)])))).join('');if(page==='Postseason')h=sec('Playoff picture',table(['Conference','Current contenders'],[0,1].map(c=>[c?'NFC':'AFC', (s.phase==='regular'?rank.filter(t=>Math.floor(t.d/4)===c).slice(0,s.slots).map(t=>t.id):s.pools?.[c]||[]).map(nm).join(', ')])))+sec('Postseason results',results(s.results.filter(g=>g.post)));if(page==='History')h=historical();if(page==='Commissioner'){h=sec('League rules',`<p>${s.games} games • ${s.slots} playoff teams per conference • ${s.impact}% per tier difference • No home advantage or momentum.</p>`)+sec('Franchise intervention',`<select id="target">${s.teams.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select><select id="action"><option value="up">Improve one tier</option><option value="down">Decline one tier</option>${tiers.map((t,i)=>`<option value="${i}">Set ${t}</option>`).join('')}</select><button onclick="intervene()">Apply</button><button onclick="inspect=!inspect;render()">${inspect?'Hide':'Inspect'} tiers</button>${inspect?table(['Team','Tier'],s.teams.map(t=>[esc(t.name),tiers[t.tier]])):''}`);if(s.phase==='owners')h+=sec('Ownership proposals',s.proposals.map((p,i)=>`<p>${p.label} — ${p.yes} yes / ${s.teams.length-p.yes} no. ${p.done?p.out:`<button onclick="vote(${i},false)">Accept vote</button><button onclick="vote(${i},true)">Override / adopt</button>`}</p>`).join('')+'<button onclick="renameTeam()">Relocate selected team</button><button onclick="realign()">Realign selected team</button><button onclick="expand()">Expand league</button>');h+=sec('Intervention log',s.log.map(esc).join('<br>')||'No interventions.');}document.getElementById('main').innerHTML=h}
const codes='buf mia ne nyj bal cin cle pit hou ind jax ten den kc lv lac dal nyg phi wsh chi det gb min atl car no tb ari lar sf sea'.split(' '), colors='00338d 008e97 002244 125740 241773 fb4f14 311d00 ffb612 03202f 002c5f 006778 4b92db fb4f14 e31837 a5acaf 0080c6 869397 0b2265 004c54 5a1414 0b162a 0076b6 203731 4f2683 a71930 0085ca d3bc8d d50a0a 97233f 003594 aa0000 69be28'.split(' ');

function logo(t){return t.id<32?`<img class="logo" src="https://a.espncdn.com/i/teamlogos/nfl/500/${codes[t.id]}.png" alt="" onerror="this.style.display='none'">`:''}

function standings(ts){return table(['Team','W','L','Div','Streak'],displayRank(ts).map(t=>[identity(t),t.w,t.l,t.dw+'–'+t.dl,t.st>0?'W'+t.st:t.st<0?'L'+(-t.st):'—']))}
function story(g){let w=team(g.w),l=team(g.l), priorW=w.w-1,priorL=l.l-1;let rival=s.rivals[[w.id,l.id].sort((a,b)=>a-b).join(':')]||0; if(g.post)return [w.name+' survives the postseason test',l.name+' is eliminated; the road to a title continues for the winner.'];if(s.week>=4&&priorW<w.l&&l.w>priorL+1)return [w.name+' shocks a contender',`Entering at ${priorW}–${w.l}, the winner disrupts ${l.name}'s campaign. A reminder that records do not decide games.`];if(w.st>=3)return [w.name+' stretches its streak to '+w.st,`At ${w.w}–${w.l}, the pressure is shifting to its rivals. Can anyone interrupt this run?`];if(l.st<=-3)return [l.name+' faces mounting pressure',`${-l.st} straight losses have left the franchise searching for answers. ${w.name} capitalizes.`];if(rival>=2||w.d===l.d)return [w.name+' claims rivalry bragging rights',`A direct blow to ${l.name}. ${w.d===l.d?'The division race now has a new head-to-head result.':'Their shared history gains another chapter.'}`];if(s.week>=3&&l.l===1)return [w.name+' ends an unbeaten run',`${l.name} finally tastes defeat after ${l.w} wins. The league has one fewer undefeated contender.`];return [w.name+' takes the opportunity',`${w.w}–${w.l} versus ${l.w}–${l.l} after the game. ${w.w>w.l?'The winner is building a winning campaign.':w.w===w.l?'The winner is back at even footing.':'The winner takes a step toward recovery.'}`]}
function gameCards(gs){return gs.map(g=>{let [a,b]=story(g);return `<article style="--team:#${colors[g.w]||'657a91'}"><div class="match">${identity(team(g.w))}<b class="win">${g.wr||team(g.w).w+"–"+team(g.w).l} · WIN</b></div><div class="match muted">${identity(team(g.l))}<span>${g.lr||team(g.l).w+"–"+team(g.l).l} · LOSS</span></div><h3>${esc(a)}</h3><p>${esc(b)}</p></article>`}).join('')}
function showNext(all=false){reveal=all?s.last.length:Math.min(reveal+1,s.last.length);pending=reveal<s.last.length;save();render()}
function setView(v){view=v;render()}
advance=function(){if(pending){showNext(true);return}let oldPhase=s.phase, before=new Map(s.teams.map(t=>[t.id,t.tier]));originalAdvance();if(oldPhase==='owners'){s.publicDev=s.teams.map(t=>({id:t.id,delta:t.tier-(before.get(t.id)??t.tier)})).filter(x=>x.delta!==0);save()}if(oldPhase==='regular'||['wild','division','conference','super'].includes(oldPhase)){reveal=0;pending=s.last.length>0;}render()};
render=function(){originalRender();let main=document.getElementById('main'),btn=document.getElementById('advance');if(pending){btn.textContent='Reveal all results'; if(page!=='Headquarters'){page='Headquarters';originalRender();btn.textContent='Reveal all results';}}if(page==='Standings'){main.innerHTML=`<div class="tabs">${['Division','Conference','League'].map(v=>`<button class="${view===v?'active':''}" onclick="setView('${v}')">${v}</button>`).join('')}</div>`+(view==='Division'?'<div class="grid">'+groups.map((g,i)=>sec(g,standings(s.teams.filter(t=>t.d===i)))).join('')+'</div>':view==='Conference'?[0,1].map(c=>sec(c?'NFC':'AFC',standings(s.teams.filter(t=>Math.floor(t.d/4)===c)))).join(''):sec('Entire league',standings(s.teams)));}if(page==='Headquarters'){let gs=s.last||[], shown=pending?gs.slice(0,reveal):gs;let stages=['review','owners','development','preseason'];let off='';if(!pending&&stages.includes(s.phase)){if(s.phase==='review')off=sec('Championship edition',identity(s.teams.find(t=>t.champ)||s.teams[0])+'<p>Season complete. Ownership meetings and the rebuilding lottery are next.</p>');if(s.phase==='owners')off=sec(' owners meeting'.trim(),(s.proposals||[]).map(p=>`<article><h3>${esc(p.label)}</h3><p>${p.yes} owners in favor · ${s.teams.length-p.yes} opposed · ${p.done?esc(p.out):'Awaiting decision'}</p></article>`).join('')+`<button onclick="go('Commissioner')">Review proposals</button>`);if(['development','preseason'].includes(s.phase)){let d=s.publicDev||[];off=sec('Offseason development wire',`<h3 class="win">Lottery / development winners</h3>${d.filter(x=>x.delta>0).map(x=>`<article>${identity(team(x.id))}<p>${x.delta>1?'Major organizational breakthrough reported.':'Insiders report a meaningful step forward.'}</p></article>`).join('')||'<p>No confirmed net improvements.</p>'}<h3>Organizations under pressure</h3>${d.filter(x=>x.delta<0).map(x=>`<article>${identity(team(x.id))}<p>Reports suggest the organization may be losing ground.</p></article>`).join('')||'<p>No confirmed net declines.</p>'}<p>${(s.dev||[]).filter(x=>x.includes('ownership')).join('<br>')}</p>`);if(s.phase==='preseason')off+=sec('Preseason watchlist',(s.pred||[]).map((id,i)=>`<p>${i+1}. ${identity(team(id))}</p>`).join(''));}}let controls=pending?`<div class="reveal"><p>${reveal} of ${gs.length} games revealed</p><button onclick="showNext()">Reveal next matchup</button><button onclick="showNext(true)">Reveal all</button>${gs[reveal]?'<p>Up next: '+identity(team(gs[reveal].a))+' vs '+identity(team(gs[reveal].b))+'</p>':''}</div>`:'';main.innerHTML=off+sec(pending?'Game day live':'Latest results & storylines',controls+gameCards([...shown].reverse())+(gs.length?'':'<p>Awaiting kickoff.</p>'))+(!pending?sec('League leaders',standings(displayRank(s.teams).slice(0,8)))+sec('News wire',s.news.slice(0,8).map(n=>'<p>'+n+'</p>').join('')):'');}if(page==='Media'){main.innerHTML=sec('Around the league',gameCards(s.last||[]))+main.innerHTML;}if(pending)document.getElementById('nav').querySelectorAll('button').forEach(b=>{if(b.textContent!=='Headquarters')b.disabled=true});};

// V3 extensions, additive save migration
s.events ||= []; s.picks ||= []; s.awards ||= []; s.tournaments ||= [];
const v2advance=advance,v2render=render;
function wire(t,kind,body){s.events.unshift({season:s.season,week:s.week,id:t.id,kind,body});}
function eventCards(es){return es.map(e=>`<article>${identity(team(e.id))}<small> S${e.season} · W${e.week}</small><h3>${esc(e.kind)}</h3><p>${esc(e.body)}</p></article>`).join('')||'<p>No developments reported yet.</p>'}
function picks(){let r=displayRank(s.teams), a=[r[0], [...r].sort((a,b)=>b.st-a.st)[0], [...r].sort((a,b)=>totals(b)-totals(a))[0]];return a.map((t,i)=>({season:s.season,analyst:['Marcus Reed','Vince Callahan','Claire Bennett'][i],id:t.id}));}
advance=function(){let phase=s.phase,wasPending=pending, before=s.teams.map(t=>({id:t.id,tier:t.tier,st:t.st}));v2advance();if(wasPending)return;if(phase==='regular') {for(let t of s.teams){let old=before.find(x=>x.id===t.id);t.momentum=Math.max(-2,Math.min(2,Math.trunc(t.st/3)));if(t.st===3)wire(t,'Momentum building','Three straight wins have changed the mood inside the organization.');if(t.st===-3)wire(t,'Locker room tension','Three consecutive defeats have put leadership under scrutiny.');if(t.st===-5&&t.fired!==s.season&&rnd()<.65){t.fired=s.season;t.tier=clamp(t.tier+(rnd()<.55?1:-1));wire(t,'Coach dismissed','Ownership has opted for a change in direction. The interim regime faces an uncertain road.');}if(old.tier!==t.tier)wire(t,t.tier>old.tier?'Organizational breakthrough':'Setback behind the scenes',t.tier>old.tier?'Insiders report renewed confidence; the results will tell whether it lasts.':'Questions are emerging about preparation and cohesion.');if(old.st<=-3&&t.st===1)wire(t,'Turning point?','A long losing streak is over. The franchise has a chance to reset.');if(s.week===Math.ceil(s.schedule.length/2)){let prev=t.history.at(-1);if(prev&&t.w/(t.w+t.l)>prev.wins/(prev.wins+prev.losses)+.25)wire(t,'Midseason resurgence','The club is dramatically ahead of last season’s pace.');else if(prev&&t.w/(t.w+t.l)<prev.wins/(prev.wins+prev.losses)-.25)wire(t,'Midseason regression','Last season’s standard now looks difficult to repeat.');}}if(s.week===1&&!s.picks.some(p=>p.season===s.season))s.picks.push(...picks());}if(phase==='super'){let r=displayRank(s.teams), best=[...r].sort((a,b)=>b.history.at(-1).score-a.history.at(-1).score)[0],rise=[...r].sort((a,b)=>(b.w-(b.history.at(-2)?.wins??b.w))-(a.w-(a.history.at(-2)?.wins??a.w)))[0];s.awards.push({season:s.season,best:best.id,regular:r[0].id,rise:rise.id});}if(phase==='preseason')s.teams.forEach(t=>t.momentum=0);save();render()};
function bracket(){let seeded=s.teams.filter(t=>t.seed),stages=['wild','division','conference','super'];let label={wild:'Wild card',division:'Divisional',conference:'Conference final',super:'Super Bowl'};if(!seeded.length)return '<p>Bracket opens when the regular season ends.</p>'+[0,1].map(c=>sec(c?'NFC race':'AFC race',standings(displayRank(s.teams.filter(t=>Math.floor(t.d/4)===c)).slice(0,s.slots)))).join('');let out='';for(let c of [0,1]){let ts=seeded.filter(t=>Math.floor(t.d/4)===c).sort((a,b)=>a.seed-b.seed);out+=`<h3>${c?'NFC':'AFC'}</h3><div class="bracket">`+stages.slice(0,3).map(stage=>{let games=s.results.filter(g=>g.post&&g.stage===stage&&Math.floor(team(g.a).d/4)===c);let pool=stage==='wild'?ts.map(t=>t.id):s.phase===stage?s.pools[c]:[];let byes=stage==='wild'?(s.slots===6?2:s.slots===7?1:0):0;let bye=stage==='wild'?pool.slice(0,byes):[];if(!games.length&&pool.length){pool=pool.slice(byes).sort((a,b)=>team(a).seed-team(b).seed);while(pool.length>1)games.push({a:pool.shift(),b:pool.pop()});}return `<div><h4>${label[stage]}</h4>`+bye.map(id=>`<article>${identity(team(id))}<small> #${team(id).seed} · BYE</small></article>`).join('')+(games.map(g=>`<article>${[g.a,g.b].map(id=>`<div class="match ${g.w===id?'win':''}">${identity(team(id))}<small>#${team(id).seed} · ${team(id).w}–${team(id).l} ${g.w===id?' ✓':''}</small></div>`).join('')}</article>`).join('')||'<p>Awaiting qualifiers</p>')+'</div>'}).join('')+'</div>';}let final=s.results.find(g=>g.post&&g.stage==='super');return out+sec('Super Bowl',final?gameCards([final]):s.phase==='super'?s.pools.flat().map(id=>identity(team(id))).join(' vs '):'Awaiting conference champions');}
function tournament(){let all=s.teams.flatMap(t=>t.history.map(h=>({...h,id:t.id}))).sort((a,b)=>b.score-a.score).slice(0,32);if(all.length<2)return;let seed=(Date.now()>>>0), random=()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296};let n=2**Math.floor(Math.log2(all.length)),pool=all.slice(0,n),rounds=[];while(pool.length>1){let games=[],next=[];while(pool.length>1){let a=pool.shift(),b=pool.pop(),w=random()<.5+(a.tier-b.tier)*s.impact/100?a:b;games.push({a,b,w});next.push(w)}rounds.push(games);pool=next;}s.tournaments.unshift({champ:pool[0],rounds});save();render()}
function archiveExtras(){return sec('Annual honors',s.awards.slice().reverse().map(a=>`<p>Season ${a.season} · Best team: ${nm(a.best)} · Regular-season leader: ${nm(a.regular)} · Improvement award: ${nm(a.rise)}</p>`).join('')||'Awards begin with the next completed season.')+sec('Battle of the eras','<p>Exhibition only. Top historical teams compete without changing official records.</p><button onclick="tournament()">Run historical tournament</button>'+ (s.tournaments[0]?`<h3>Winner: ${esc(s.tournaments[0].champ.name)} · S${s.tournaments[0].champ.season}</h3>`+s.tournaments[0].rounds.map((r,i)=>`<h4>Round ${i+1}</h4>`+r.map(g=>`<p>${esc(g.a.name)} S${g.a.season} vs ${esc(g.b.name)} S${g.b.season} → ${esc(g.w.name)} S${g.w.season}</p>`).join('')).join(''):''))}
render=function(){v2render();let main=document.getElementById('main');if(pending)return;if(page==='Headquarters')main.innerHTML+=sec('Inside the league · latest developments',eventCards(s.events.filter(e=>e.season===s.season&&e.week>=s.week-2).slice(0,16)));if(page==='Postseason')main.innerHTML=sec('Playoff bracket · reseeded each round',bracket())+main.innerHTML;if(page==='Media')main.innerHTML+=sec('League developments',eventCards(s.events.slice(0,40)))+sec('Analyst championship picks',table(['Season','Analyst','Pick','Outcome'],s.picks.slice().reverse().map(p=>[p.season,p.analyst,nm(p.id),s.archive.find(a=>a.season===p.season)?s.archive.find(a=>a.season===p.season).champ===p.id?'Correct':'Miss':'Pending'])));if(page==='History')main.innerHTML+=archiveExtras();if(page==='Franchises')main.innerHTML+=sec('Persistent franchise stories',eventCards(s.events.slice(0,100)));};

render();</script></body></html>
