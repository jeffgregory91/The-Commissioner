
name: Publish Game

on:
  workflow_dispatch:
    inputs:
      candidate:
        description: "HTML filename to publish"
        required: true
        default: "the_commissioner_v4_5_media_candidate.html"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Backup and publish
        env:
          CANDIDATE: ${{ inputs.candidate }}
        run: |
          case "$CANDIDATE" in
            ""|*/*|*..*|*[!a-zA-Z0-9._-]*)
              echo "Invalid filename"
              exit 1
              ;;
          esac
          test -f "$CANDIDATE" || {
            echo "Candidate not found"
            exit 1
          }
          cp index.html index-backup.html
          cp "$CANDIDATE" index.html

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html index-backup.html
          git diff --cached --quiet || git commit -m "Publish game update"
          git push
